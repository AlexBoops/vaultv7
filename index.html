<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Apps | AJH's Vault V6.5</title>
      <link rel="icon" href="../icon.png" type="image/png">

      <!-- Font Awesome & Libraries -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
      <script src="https://cdn.tailwindcss.com"></script>

      <!-- Stylesheet resolved up one directory to root -->
      <link rel="stylesheet" href="../index.css">

      <style>
         body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
         }
         .app-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
         }
         .app-card:hover {
            transform: scale(1.05);
            opacity: 0.9;
         }
         .app-icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
         }
         .app-name {
            margin-top: 8px;
            font-size: 0.875rem;
            color: #d1d5db;
            text-align: center;
         }
      </style>
   </head>
   <body class="bg-black">

      <!-- Top Navigation Bar -->
      <header class="w-full flex items-center justify-between px-6 py-4 border-b border-neutral-800 bg-black/80 backdrop-blur sticky top-0 z-50">
         <div class="flex items-center space-x-6">
            <!-- Home Logo & Button -->
            <a href="../" class="flex flex-col items-center group">
               <span class="text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-gray-200 to-white">Vault</span>
               <span class="text-xs font-semibold text-neutral-400 group-hover:text-white transition-colors">V6.5</span>
            </a>

            <!-- Home Button -->
            <a href="../" class="flex items-center space-x-2 px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-700/60 hover:bg-neutral-800 transition-colors">
               <i class="fa-solid fa-house text-sm"></i>
               <span class="text-sm font-medium">Home</span>
            </a>

            <!-- Games Button -->
            <a href="../g/" class="flex items-center space-x-2 px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-700/60 hover:bg-neutral-800 transition-colors">
               <i class="fa-solid fa-gamepad text-sm"></i>
               <span class="text-sm font-medium">Games</span>
            </a>

            <!-- Tools Button -->
            <a href="../t/" class="flex items-center space-x-2 px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-700/60 hover:bg-neutral-800 transition-colors">
               <i class="fa-solid fa-screwdriver-wrench text-sm"></i>
               <span class="text-sm font-medium">Tools</span>
            </a>
         </div>

         <!-- Search Input -->
         <div class="relative w-72">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400 text-sm"></i>
            <input 
               type="text" 
               id="search-input" 
               placeholder="Search for apps" 
               oninput="filterApps()"
               class="w-full pl-9 pr-4 py-2 bg-neutral-900 border border-neutral-700/60 rounded-xl text-sm text-white placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-500 transition-all"
            />
         </div>
      </header>

      <!-- Apps Grid Container -->
      <main class="max-w-6xl mx-auto px-6 py-10">
         <div id="apps-container" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-7 gap-8 justify-items-center">

            <!-- TikTok -->
            <div class="app-card" onclick="launchApp('https://www.tiktok.com')">
               <img class="app-icon" src="https://cdn.simpleicons.org/tiktok/white" style="background:#000; padding:12px; border:1px solid #333;" alt="TikTok">
               <span class="app-name">TikTok</span>
            </div>

            <!-- Xbox -->
            <div class="app-card" onclick="launchApp('https://www.xbox.com/play')">
               <img class="app-icon" src="https://cdn.simpleicons.org/xbox/107C10" style="background:#0e1012; padding:12px; border:1px solid #333;" alt="Xbox">
               <span class="app-name">Xbox</span>
            </div>

            <!-- YouTube -->
            <div class="app-card" onclick="launchApp('https://www.youtube.com')">
               <img class="app-icon" src="https://cdn.simpleicons.org/youtube/FF0000" style="background:#181818; padding:12px; border:1px solid #333;" alt="YouTube">
               <span class="app-name">YouTube</span>
            </div>

            <!-- Snapchat -->
            <div class="app-card" onclick="launchApp('https://web.snapchat.com')">
               <img class="app-icon" src="https://cdn.simpleicons.org/snapchat/000" style="background:#FFFC00; padding:12px;" alt="Snapchat">
               <span class="app-name">Snapchat</span>
            </div>

            <!-- P-Stream -->
            <div class="app-card" onclick="launchApp('https://pstream.mov')">
               <div class="app-icon flex items-center justify-center bg-purple-900 border border-purple-700">
                  <i class="fa-solid fa-masks-theater text-3xl text-purple-300"></i>
               </div>
               <span class="app-name">P-Stream</span>
            </div>

            <!-- Discord -->
            <div class="app-card" onclick="launchApp('https://discord.com/app')">
               <img class="app-icon" src="https://cdn.simpleicons.org/discord/5865F2" style="background:#1e1f22; padding:12px; border:1px solid #333;" alt="Discord">
               <span class="app-name">Discord</span>
            </div>

            <!-- VSC (VS Code) -->
            <div class="app-card" onclick="launchApp('https://vscode.dev')">
               <img class="app-icon" src="https://cdn.simpleicons.org/visualstudiocode/007ACC" style="background:#1e1e1e; padding:12px; border:1px solid #333;" alt="VSC">
               <span class="app-name">VSC</span>
            </div>

            <!-- ChatGPT -->
            <div class="app-card" onclick="launchApp('https://chatgpt.com')">
               <img class="app-icon" src="https://cdn.simpleicons.org/openai/white" style="background:#10a37f; padding:12px;" alt="ChatGPT">
               <span class="app-name">ChatGPT</span>
            </div>

            <!-- Google -->
            <div class="app-card" onclick="launchApp('https://www.google.com')">
               <img class="app-icon" src="https://cdn.simpleicons.org/google" style="background:#ffffff; padding:12px;" alt="Google">
               <span class="app-name">Google</span>
            </div>

            <!-- SpaceHey -->
            <div class="app-card" onclick="launchApp('https://spacehey.com')">
               <div class="app-icon flex flex-col items-center justify-center bg-blue-600 border border-blue-400">
                  <span class="text-xs font-bold leading-tight">hey</span>
                  <i class="fa-solid fa-user text-xl"></i>
               </div>
               <span class="app-name">SpaceHey</span>
            </div>

            <!-- Wikipedia -->
            <div class="app-card" onclick="launchApp('https://en.wikipedia.org')">
               <img class="app-icon" src="https://cdn.simpleicons.org/wikipedia/white" style="background:#111; padding:12px; border:1px solid #333;" alt="Wikipedia">
               <span class="app-name">Wikipedia</span>
            </div>

            <!-- SoundCloud -->
            <div class="app-card" onclick="launchApp('https://soundcloud.com')">
               <img class="app-icon" src="https://cdn.simpleicons.org/soundcloud/FF5500" style="background:#1a1a1a; padding:12px; border:1px solid #333;" alt="SoundCloud">
               <span class="app-name">SoundCloud</span>
            </div>

            <!-- Brainly -->
            <div class="app-card" onclick="launchApp('https://brainly.com')">
               <div class="app-icon flex items-center justify-center bg-emerald-800 border border-emerald-600">
                  <span class="text-3xl font-black">B</span>
               </div>
               <span class="app-name">Brainly</span>
            </div>

            <!-- Cobalt -->
            <div class="app-card" onclick="launchApp('https://cobalt.tools')">
               <div class="app-icon flex items-center justify-center bg-neutral-900 border border-neutral-700 text-2xl font-bold">
                  &gt;&gt;
               </div>
               <span class="app-name">Cobalt</span>
            </div>

            <!-- Coconut -->
            <div class="app-card" onclick="launchApp('https://coconut.ai')">
               <div class="app-icon flex items-center justify-center bg-amber-900/60 border border-amber-800 text-3xl">
                  🥥
               </div>
               <span class="app-name">Coconut</span>
            </div>

            <!-- QuillBot -->
            <div class="app-card" onclick="launchApp('https://quillbot.com')">
               <div class="app-icon flex flex-col items-center justify-center bg-green-800 border border-green-600">
                  <i class="fa-solid fa-robot text-2xl text-green-200"></i>
                  <span class="text-[10px] font-bold mt-1">QuillBot</span>
               </div>
               <span class="app-name">QuillBot</span>
            </div>

            <!-- szyvflix -->
            <div class="app-card" onclick="launchApp('https://szyvflix.com')">
               <div class="app-icon flex items-center justify-center bg-neutral-900 border border-neutral-700 text-3xl font-bold tracking-tighter">
                  sf
               </div>
               <span class="app-name">szyvflix</span>
            </div>

         </div>
      </main>

      <!-- App View Iframe Overlay (For Ultraviolet Proxy) -->
      <div id="app-container" class="fixed inset-0 z-50 bg-black hidden flex-col">
         <div class="flex items-center justify-between px-4 py-2 bg-neutral-900 border-b border-neutral-800">
            <button onclick="closeApp()" class="px-3 py-1 bg-neutral-800 hover:bg-neutral-700 rounded-lg text-sm transition-colors">
               <i class="fa-solid fa-arrow-left mr-1"></i> Back
            </button>
            <button onclick="closeApp()" class="text-neutral-400 hover:text-white px-2 py-1">
               <i class="fa-solid fa-xmark text-lg"></i>
            </button>
         </div>
         <iframe id="app-iframe" class="w-full h-full border-none" src="about:blank"></iframe>
      </div>

      <!-- Scripts pointing up one directory to repo root files -->
      <script src="../uv/uv.bundle.js" charset="UTF-8" defer></script>
      <script src="../uv/uv.config.js" charset="UTF-8" defer></script>
      <script src="../register-sw.js" charset="UTF-8" defer></script>
      <script src="../search.js" charset="UTF-8" defer></script>
      <script src="../index.js" charset="UTF-8" defer></script>

      <script>
         // Launch via Ultraviolet if available, otherwise open in iframe/fallback
         function launchApp(url) {
            const container = document.getElementById('app-container');
            const iframe = document.getElementById('app-iframe');
            
            if (window.__uv$config && typeof __uv$config.encodeUrl === 'function') {
               const encoded = __uv$config.prefix + __uv$config.encodeUrl(url);
               iframe.src = encoded;
            } else {
               iframe.src = url;
            }
            container.classList.remove('hidden');
            container.classList.add('flex');
         }

         function closeApp() {
            const container = document.getElementById('app-container');
            const iframe = document.getElementById('app-iframe');
            iframe.src = 'about:blank';
            container.classList.remove('flex');
            container.classList.add('hidden');
         }

         // Search filter
         function filterApps() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const cards = document.querySelectorAll('.app-card');
            cards.forEach(card => {
               const name = card.querySelector('.app-name').textContent.toLowerCase();
               card.style.display = name.includes(query) ? 'flex' : 'none';
            });
         }
      </script>
   </body>
</html>
