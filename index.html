<!DOCTYPE html>
<html lang="en">
   <head>
      <!-- Enforce base path so GitHub Pages never drops /vaultv7/ -->
      <base href="/vaultv7/">

      <!-- Font Awesome Icons -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
      
      <!-- CSS inside static/ -->
      <link rel="stylesheet" href="static/index.css">
      <script src="https://cdn.tailwindcss.com"></script>
      
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>AJH's Vault V6.5</title>
      <link rel="icon" href="static/icon.png" type="image/png">
   </head>
   <body class="bg-black" onload="registerServiceWorker()">

   <div id="loading-screen" class="fixed inset-0 z-[9999] bg-black flex flex-col items-center justify-center text-white">
       <div class="w-48 h-48 border-[20px] border-white border-t-transparent rounded-full animate-spin mb-6"></div>
       <p class="text-4xl font-semibold tracking-wide">Loading AJH’s Vault...</p>
   </div>
   <script>
    window.addEventListener("load", () => {
      const loader = document.getElementById("loading-screen");
      if (loader) {
        loader.classList.add("opacity-0", "transition-opacity", "duration-500");
        setTimeout(() => {
          loader.remove();
          document.body.classList.remove("overflow-hidden");
        }, 500);
      }
    });
   </script>
  
      <canvas id="canvas"></canvas>
      <div class="text-white min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
      <div class="container text-center max-w-md relative">
         <div class="flex items-center justify-center space-x-4">
             <div id="logo" class="text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-gray-300 to-white">
                 Vault v6.5
             </div>
         </div>

              <div class="grid grid-cols-3 gap-2 mb-2 mt-4">
                
                <form id="uv-form" class="col-span-2">
                  <input id="uv-search-engine" value="https://duckduckgo.com/search?q=%s" type="hidden"/> 
                  <input 
                      id="uv-address" 
                      type="text" 
                      placeholder="🔍 The fastest static proxy, ever." 
                      required
                      class="w-full px-4 py-2 bg-transparent border border-neutral-400/50 rounded-lg text-white placeholder-neutral-300 focus:outline-none focus:ring-2 focus:ring-neutral-400 focus:bg-black/50 transition-all duration-250"
                  />
                </form>
                
                <a 
                    href="g/" 
                    class="py-2 bg-transparent border border-neutral-400/50 rounded-lg text-white hover:bg-black/50 transition-all duration-250 self-center"
                ><i class="fa-solid fa-gamepad"></i> Games
                </a>
            
                <a 
                    href="a/" 
                    class="py-2 bg-transparent border border-neutral-400/50 rounded-lg text-white hover:bg-black/50 transition-all duration-250 self-center"
                ><i class="fa-brands fa-app-store-ios"></i> Apps 
                </a>

                <a 
                    href="education/" 
                    class="py-2 bg-transparent border border-neutral-400/50 rounded-lg text-white hover:bg-black/50 transition-all duration-250 self-center"
                ><i class="fa-solid fa-school"></i> Education
                </a>
        
                <a 
                    href="t/" 
                    class="py-2 bg-transparent border border-neutral-400/50 rounded-lg text-white hover:bg-black/50 transition-all duration-250 self-center"
                ><i class="fa-solid fa-screwdriver-wrench"></i> Tools
                </a>
                
                <a 
                    href="https://docs.google.com/document/d/14LlAmWkhchNJ83BhM3KFEk4MLhu5HERqlwljGJs6fN4/view?usp=sharing" 
                    target="_blank"
                    rel="noopener noreferrer"
                    class="py-2 bg-transparent border border-neutral-400/50 rounded-lg text-white hover:bg-black/50 transition-all duration-250 self-center"
                ><i class="fa-solid fa-link"></i> Link Portal
                </a>
                
                <a 
                    href="vm/" 
                    class="py-2 bg-transparent border border-neutral-400/50 rounded-lg text-white hover:bg-black/50 transition-all duration-250 self-center"
                ><i class="fa-solid fa-desktop"></i> VM (beta)
                </a>
                
                <a 
                    href="ia/" 
                    class="py-2 bg-transparent border border-neutral-400/50 rounded-lg text-white hover:bg-black/50 transition-all duration-250 self-center"
                ><i class="fa-solid fa-robot"></i> AI
                </a>
                
                <a 
                    href="c/" 
                    class="py-2 bg-transparent border border-neutral-400/50 rounded-lg text-white hover:bg-black/50 transition-all duration-250 self-center"
                ><i class="fa-solid fa-message"></i> Chatroom
                </a>
                
                <div class="flex items-center bg-red-900 border-t-4 border-red-700 col-span-2" role="alert">
                    <a class="text-xl" href="https://chng.it/s5StkhSqpJ" target="_blank" rel="noopener noreferrer">CLICK TO SIGN THE PETITION</a>
                </div>
              </div>
            </div>

            <span class="text-neutral-400 text-sm quote-thing"></span>
  
            <div class="desc left-margin text-neutral-400">
                <p id="uv-error"></p>
                <pre id="uv-error-code"></pre>
            </div>
      </div>
   </div>

   <div class="fixed bottom-0 p-4 text-neutral-500">
      <a class="underline" href="https://discord.gg/RxDCZz7E5R" target="_blank" rel="noopener noreferrer">discord.gg/RxDCZz7E5R</a>
      <a class="ml-10 underline" href="privacy-policy/">Privacy policy</a>
      <a class="ml-10 underline" href="contact/">Contact</a>
      <a class="ml-10 underline" href="partners/">Partners</a>
   </div>

   <div id="comets">
    <i></i>
    <i></i>
    <i></i>
   </div>
  
      <!-- Scripts mapped accurately to static/ -->
      <script src="static/uv/uv.bundle.js" charset="UTF-8" defer></script>
      <script src="static/uv/uv.config.js" charset="UTF-8" defer></script>
      <script src="static/register-sw.js" charset="UTF-8" defer></script>
      <script src="static/search.js" charset="UTF-8" defer></script>
      <script src="static/index.js" charset="UTF-8" defer></script>
      <script src="static/quotes.js" charset="UTF-8" defer></script>
      
      <script>
        function registerServiceWorker() {
          "use strict";
          const stockSW = "static/uv/uv-sw.js";
          if (!navigator.serviceWorker || location.protocol !== "https:") return;

          navigator.serviceWorker.register(stockSW, {
            scope: "/vaultv7/service/"
          }).catch(e => {
            console.warn("SW registration skipped:", e);
          });
        }
      </script>
  </body>
</html>
